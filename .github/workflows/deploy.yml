name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/product-brainstorm-creative-e6h39c]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ── Build ONE (static export → GitHub Pages) ───────────────────
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /Sales

      # ── StyleUp now deploys to Vercel (needs server for API routes) ─
      # See styleup/vercel.json and styleup/.env.example for setup.
      # To preview StyleUp statically, run: cd styleup && npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
